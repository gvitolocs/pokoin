[package]
name = "pokoin-catalog-routes"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "time", "derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
async-trait = "0.1"

[dev-dependencies]
http = "1"
tower = "0.5"
