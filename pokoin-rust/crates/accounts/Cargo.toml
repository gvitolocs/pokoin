[package]
name = "pokoin-accounts"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
description = "Native Rust Pokoin accounts/auth/social/collection domain (Firebase + Firestore over HTTPS)"

# Direct dependency versions on purpose: this crate must compile standalone
# (scratch workspace) as well as inside pokoin-rust. No `workspace = true`
# inheritance here so the coordinator can add it to any workspace.
[dependencies]
pokoin-sort = { path = "../sort" }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "original-uri"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
base64 = "0.22"
jsonwebtoken = "9"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std", "arithmetic"] }
aes-gcm = "0.10"
regex = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json", "uuid", "bigdecimal"] }
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
unicode-normalization = "0.1"
image = { version = "0.25", default-features = false, features = ["webp", "jpeg", "png", "gif"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
