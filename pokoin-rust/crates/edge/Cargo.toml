[package]
name = "pokoin-edge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native public edge (api.pokoin.com origin) and disk CDN (cdn.pokoin.com origin) for the Pi."

# Dependencies are preset for the porting worker. Ask the coordinator before adding any.
[dependencies]
pokoin-api-common = { path = "../api-common" }
axum = { workspace = true }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = "0.1"
httpdate = "1"
percent-encoding = "2"
regex = "1"
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "sync", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { workspace = true, features = ["util"] }
tracing = { workspace = true }
url = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
