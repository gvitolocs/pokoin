[package]
name = "pokoin-external"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Rust port of the Pokoin external-integrations API domain (CardTrader, PowerTools, Scan Connect, R2 photos, system endpoints)."

[dependencies]
pokoin-api-common = { path = "../api-common" }
unicode-normalization = "0.1"
anyhow = "1"
axum = { version = "0.8", features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync"] }
tower = { version = "0.5", features = ["limit", "util"] }
thiserror = "2"
tracing = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "time", "json", "uuid"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
base64 = "0.22"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
jsonwebtoken = "9"
regex = "1"
rand = "0.8"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
futures-util = "0.3"
bytes = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
percent-encoding = "2"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
