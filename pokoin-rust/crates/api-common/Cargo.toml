[package]
name = "pokoin-api-common"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared runtime pieces for native Pokoin API route crates: pools, Redis, game scoping, Node-compatible request/response helpers."

[dependencies]
async-trait = "0.1"
axum = { workspace = true }
bytes = "1"
hex = { workspace = true }
sha2 = { workspace = true }
pokoin-accounts = { path = "../accounts" }
pokoin-config = { path = "../config" }
redis = { workspace = true }
regex = "1"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = "0.7"
sqlx = { workspace = true, features = ["json", "chrono", "uuid", "bigdecimal"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
