[package]
name = "pokoin-api-common"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared runtime pieces for native Pokoin API route crates: pools, Redis, game scoping, Node-compatible request/response helpers."

[dependencies]
axum = { workspace = true }
bytes = "1"
pokoin-accounts = { path = "../accounts" }
pokoin-config = { path = "../config" }
redis = { workspace = true }
regex = "1"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = "0.7"
sqlx = { workspace = true, features = ["json", "chrono"] }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
