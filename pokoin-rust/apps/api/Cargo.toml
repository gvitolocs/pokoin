[package]
name = "pokoin-api"
version.workspace = true
edition.workspace = true

[[bin]]
name = "pokoin-api"
path = "src/main.rs"

[dependencies]
pokoin-edge = { path = "../../crates/edge" }
pokoin-assistant-api = { path = "../../crates/assistant-api" }
pokoin-admin-api = { path = "../../crates/admin-api" }
pokoin-search-api = { path = "../../crates/search-api" }
pokoin-catalog-api = { path = "../../crates/catalog-api" }
pokoin-api-common = { path = "../../crates/api-common" }
anyhow = { workspace = true }
axum = { workspace = true }
pokoin-auth = { path = "../../crates/auth" }
pokoin-cache = { path = "../../crates/cache" }
pokoin-config = { path = "../../crates/config" }
pokoin-db = { path = "../../crates/db" }
pokoin-integrations = { path = "../../crates/integrations" }
pokoin-listings = { path = "../../crates/listings" }
pokoin-marketplace = { path = "../../crates/marketplace" }
pokoin-observability = { path = "../../crates/observability" }
pokoin-search = { path = "../../crates/search" }
redis = { workspace = true }
serde = { workspace = true }
percent-encoding = "2"
regex = "1"
serde_urlencoded = "0.7"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx = { workspace = true, features = ["derive"] }
reqwest = { workspace = true }
pokoin-catalog = { path = "../../crates/catalog" }
pokoin-accounts = { path = "../../crates/accounts" }
pokoin-commerce = { path = "../../crates/commerce" }
pokoin-external = { path = "../../crates/external" }
pokoin-catalog-routes = { path = "../../crates/catalog-routes" }

sha2 = { workspace = true }
hex = { workspace = true }
