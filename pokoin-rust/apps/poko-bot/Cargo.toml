[package]
name = "poko-bot"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "poko-bot"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
base64 = "0.22"
frankenstein = { version = "0.52", default-features = false, features = ["client-reqwest"] }
regex = "1"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serenity = { version = "0.12.5", default-features = false, features = ["builder", "cache", "client", "gateway", "http", "model", "rustls_backend", "utils"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"
