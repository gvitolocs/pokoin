[package]
name = "pokoin-newsroom"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

# Isolated until the J17 production parity gate is complete.
[workspace]

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
futures-util = "0.3"
jsonwebtoken = "9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "signal"] }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
stateright = "0.31"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"
