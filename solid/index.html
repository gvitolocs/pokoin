<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pokoin marketplace</title>
    <meta name="theme-color" content="#000000" />
    <style>
      html, body, #root { margin: 0; min-height: 100%; background: #000; color: #fff; color-scheme: dark; }
      /* Until the app paints into #root, a slow link shows the logo instead of a black screen. */
      .boot-loader { position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 14px; opacity: 0; animation: boot-in 0.25s 0.35s forwards; font: 600 14px/1.4 system-ui, sans-serif; color: #9a9aa6; }
      .boot-loader img { width: 64px; height: 64px; animation: boot-pulse 1.2s ease-in-out infinite; }
      #root:not(:empty) + .boot-loader { display: none; }
      @keyframes boot-in { to { opacity: 1; } }
      @keyframes boot-pulse { 50% { transform: scale(0.9); opacity: 0.7; } }
      @media (prefers-reduced-motion: reduce) { .boot-loader img { animation: none; } }
    </style>
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pokoin-192.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://cdn.pokoin.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.pokoin.com" />
    <link rel="preconnect" href="https://api.pokoin.com" crossorigin />
    <link rel="preload" href="/home/satoshi.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/home/logo.png" as="image" />
    <script src="%BASE_URL%card-url-boot.js"></script>
    <script src="%BASE_URL%chunk-reload.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <div class="boot-loader" role="status"><img src="/home/logo.png" alt="" width="64" height="64" /><span>Loading Pokoin…</span></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
