# ~/.config/systemd/user/<unit>.d/70-backoff.conf on every unit that needs the Pi
# (scripts/backup/install-ops-nezopt.sh pi-follow). Restarts back off from RestartSec= to 5 min,
# so a Pi that answers on :22 but refuses the tunnel (sshd still starting, a stale -R binding
# left by a crash) costs a few retries an hour instead of one every few seconds.
[Service]
RestartSteps=8
RestartMaxDelaySec=5min
