# ~/.config/systemd/user/service.d/90-alert.conf
# Every user service reports its failure through pokoin-ops (mail + Secretary push).
# Opt out per unit with <unit>.service.d/90-alert.conf (same name shadows this file; an empty
# `OnFailure=` in another file cannot remove a dependency).
[Unit]
OnFailure=pokoin-notify@%n.service
