# ~/.config/systemd/user/{pokoin-overflow-sync,poko-video-mirror}.timer.d/50-backstop.conf
# Installed once the Pi's notify hooks run (install-ops-nezopt.sh pi-hooks-live): the hooks
# trigger the work, the timers become an hourly backstop. Remove the file to go back to 5 min.
[Timer]
OnUnitActiveSec=
OnUnitActiveSec=1h
