# ~/.config/systemd/user/pokoin-uptime-mail.service.d/alerts.conf
# Dead-man only: if the /healthz mailer itself stops running, healthchecks mails.
# No OnFailure (see pokoin-uptime-mail.service.d-90-alert.conf): the mailer exits non-zero
# when Resend is down, which is when a Resend-based notifier cannot help either.
[Service]
ExecStartPost=-%h/.local/bin/pokoin-ops hc-ping --unit %n
