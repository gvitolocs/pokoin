# ~/.config/systemd/user/pokoin-all-cardtrader-daily.service.d/alerts.conf
[Unit]
OnFailure=pokoin-notify@%n.service

[Service]
ExecStartPre=-%h/.local/bin/pokoin-ops hc-ping --unit %n start
ExecStartPost=-%h/.local/bin/pokoin-ops hc-ping --unit %n
# Room for the SIGTERM summary in scripts/run-all-cardtrader-daily.sh.
TimeoutStopSec=120

