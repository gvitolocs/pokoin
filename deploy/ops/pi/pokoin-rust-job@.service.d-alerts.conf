# /etc/systemd/system/pokoin-rust-job@.service.d/alerts.conf
[Unit]
OnFailure=pokoin-notify@%n.service

[Service]
# Dead-man ping per job (slug pi-job-%i). "+": the ping reads /etc/pokoin/alerts.env as
# root; the job itself still runs as nes. "-": a failed ping never fails the job.
ExecStartPost=-+/usr/local/bin/pokoin-ops hc-ping --unit %n
