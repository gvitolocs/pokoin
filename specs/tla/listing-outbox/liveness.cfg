\* Fixed code, liveness: under weak fairness every committed change is applied
\* when failures stay below the attempt budget and leases expire only on a
\* dead worker. (No SYMMETRY: it is unsound for liveness.)
CONSTANTS
    w1 = w1  w2 = w2
    MaxUpdates = 1
    MaxAttempts = 3
    MaxCrashes = 1
    MaxAmbiguous = 1
    MaxDestroyFailures = 0
    MaxRejects = 0
    MaxFills = 0
    MaxReplicaTimeouts = 0
    SlowWorkers = FALSE
    LinkedDeactivate = FALSE
    Fixed = TRUE

SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE

PROPERTY
    AllApplied
