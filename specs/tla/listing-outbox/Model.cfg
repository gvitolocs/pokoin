\* Fixed code, CardTrader side: every safety invariant must hold. Two API
\* instances, leases that expire under slow workers, a crash, a lost and a
\* rejected CardTrader create, a failed destroy and replica lag, interleaved
\* with create / update / deactivate. (The read cache is checked in cache.cfg.)
CONSTANTS
    w1 = w1  w2 = w2
    MaxUpdates = 2
    MaxAttempts = 3
    MaxCrashes = 1
    MaxAmbiguous = 1
    MaxDestroyFailures = 1
    MaxRejects = 1
    MaxFills = 0
    MaxReplicaTimeouts = 0
    SlowWorkers = TRUE
    LinkedDeactivate = FALSE
    Fixed = TRUE

SPECIFICATION Spec
SYMMETRY Sym
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    AtMostOncePush
    NoGhostProduct
