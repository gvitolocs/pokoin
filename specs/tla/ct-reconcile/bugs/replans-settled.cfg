\* NoReplanSettled violated.
CONSTANTS
    p1 = p1  p2 = p2
    l1 = l1  l2 = l2  l3 = l3
    r1 = r1  r2 = r2
    QtyP1 = 1
    QtyP2 = 1
    InitLinked = {p1, p2}
    MaxSales = 1
    MaxCancels = 0
    MaxDelists = 0
    MaxRuns = 1
    MaxLockLoss = 0
    MaxRedeliver = 0
    ReadModes = {"ok"}
    MassMin = 0
    Fixed = TRUE
    SkipSettled = FALSE

SPECIFICATION Spec
SYMMETRY Sym
CHECK_DEADLOCK FALSE

INVARIANTS
    NoReplanSettled
