\* Fixed code: every safety invariant must hold. Two reconcilers that can lose
\* the Redis lock, every detectable export misread, a CardTrader sale, a
\* cancellation, a delisting and a webhook redelivery, all interleaved.
CONSTANTS
    p1 = p1  p2 = p2
    l1 = l1  l2 = l2  l3 = l3
    r1 = r1  r2 = r2
    QtyP1 = 2
    QtyP2 = 1
    InitLinked = {p1}
    MaxSales = 1
    MaxCancels = 1
    MaxDelists = 1
    MaxRuns = 1
    MaxLockLoss = 1
    MaxRedeliver = 1
    ReadModes = {"ok", "empty", "alien", "nogame"}
    MassMin = 0
    Fixed = TRUE

SPECIFICATION Spec
SYMMETRY Sym
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NonNegative
    NoFalseDeactivation
    GuardBound
    NoDoubleCount
    NoStaleResurrection
    UniqueLink
