\* The guard without the flight timeout: an upstream that never answers
\* holds the leader and every follower. Expect EveryRequestEnds violated
\* (why POKOIN_API_FLIGHT_TIMEOUT_SECS exists).
CONSTANTS
    c1 = c1  c2 = c2  c3 = c3  b1 = b1
    Clients = {c1, c2, c3}
    Bg = {b1}
    None = None
    Fixed = TRUE
    Timeouts = FALSE
    UpstreamHangs = TRUE
    MaxHangUps = 0
    MaxPanics = 0
    InitCache = {"empty"}

SPECIFICATION Spec
CHECK_DEADLOCK FALSE
PROPERTIES
    EveryRequestEnds
