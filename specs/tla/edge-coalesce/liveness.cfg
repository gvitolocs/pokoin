\* PR #307 as deployed: every request ends and the key is freed, with the
\* upstream allowed to hang (the flight timeout ends it).
CONSTANTS
    c1 = c1  c2 = c2  c3 = c3  b1 = b1
    Clients = {c1, c2, c3}
    Bg = {b1}
    None = None
    Fixed = TRUE
    Timeouts = TRUE
    UpstreamHangs = TRUE
    MaxHangUps = 1
    MaxPanics = 1
    InitCache = {"empty", "stale"}

SPECIFICATION Spec
CHECK_DEADLOCK FALSE
PROPERTIES
    EveryRequestEnds
    KeyFreed
