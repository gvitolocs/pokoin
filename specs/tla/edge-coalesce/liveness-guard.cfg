\* The FlightGuard alone, without any timeout: an upstream that answers is
\* enough for every request to end, whatever leaders panic or hang up.
CONSTANTS
    c1 = c1  c2 = c2  c3 = c3  b1 = b1
    Clients = {c1, c2, c3}
    Bg = {b1}
    None = None
    Fixed = TRUE
    Timeouts = FALSE
    UpstreamHangs = FALSE
    MaxHangUps = 2
    MaxPanics = 1
    InitCache = {"empty"}

SPECIFICATION Spec
CHECK_DEADLOCK FALSE
PROPERTIES
    EveryRequestEnds
    KeyFreed
