\* 28/29 Oct: the Pi binding is a live-only edit of /etc/hosts; a reboot
\* regenerates the file from the cloud-init template. Expect RebootSafety violated.
CONSTANTS
    Pi = Pi  K3s = K3s  None = None  u1 = u1  u2 = u2
    Urls = {u1}
    Missing = {}
    Fixed = FALSE
    PersistBinding = FALSE
    OriginGatedConnector = FALSE
    PublicProbe = FALSE
    PathProbe = FALSE
    BurstAwareMemo = FALSE
    WatchdogTicks = 1
    AlertAfter = 2
    DeadTTL = 1
    DeadKeep = 3
    CanReboot = {Pi}
    CanCrash = {}
    CanDrift = {}
    MaxDrifts = 0

SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    RebootSafety
