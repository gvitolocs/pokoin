\* The pipeline design without PathProbe: the Pi's binding drifts, the watchdog
\* stops its connector, K3s serves every request, and no probe fails (the
\* 28 Oct state: one leg down, site up, nobody told). Expect RedundancyDetection violated.
CONSTANTS
    Pi = Pi  K3s = K3s  None = None  u1 = u1  u2 = u2
    Urls = {u1, u2}
    Missing = {u2}
    Fixed = FALSE
    PersistBinding = TRUE
    OriginGatedConnector = TRUE
    PublicProbe = TRUE
    PathProbe = FALSE
    BurstAwareMemo = TRUE
    WatchdogTicks = 1
    AlertAfter = 2
    DeadTTL = 1
    DeadKeep = 3
    CanReboot = {}
    CanCrash = {}
    CanDrift = {Pi}
    MaxDrifts = 1

SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    RedundancyDetection
