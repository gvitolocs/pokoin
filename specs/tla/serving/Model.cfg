\* The pipeline design: every safety property, two hosts, a page of one
\* existing and one missing image.
CONSTANTS
    Pi = Pi  K3s = K3s  None = None  u1 = u1  u2 = u2
    Urls = {u1, u2}
    Missing = {u2}
    Fixed = TRUE
    PersistBinding = TRUE
    OriginGatedConnector = TRUE
    PublicProbe = TRUE
    PathProbe = TRUE
    BurstAwareMemo = TRUE
    WatchdogTicks = 1
    AlertAfter = 2
    DeadTTL = 1
    DeadKeep = 3
    CanReboot = {Pi, K3s}
    CanCrash = {Pi, K3s}
    CanDrift = {Pi, K3s}
    MaxDrifts = 2

SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    RebootSafety
    NoFalseFailover
    Detection
    RedundancyDetection
    ClientRecovery
