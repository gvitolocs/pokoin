\* Fixed code, safety: three Card Rails attempts at once, two crashes, three creates
\* in doubt (applied, not applied, or landing later), two refusals, a lost
\* webhook, a Riftbound copy Pokoin could quote. Every invariant must hold.
CONSTANTS
    Reqs = {r1, r2, r3}
    MaxCrashes = 2
    MaxInDoubt = 3
    MaxRejects = 2
    MaxLostHooks = 1
    Grace = 2
    Quoted = TRUE
    OtherGame = TRUE
    LandsInGrace = TRUE
    Fixed = TRUE

SPECIFICATION Spec
SYMMETRY Sym
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    NoDuplicateRow
    NoDuplicateProduct
    NoDoubleDecrement
