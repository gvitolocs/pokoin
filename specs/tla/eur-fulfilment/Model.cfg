\* Fixed code, native lines: two orders on one listing, a crash, a lease that
\* expires under a live worker and a Stripe redelivery, racing payment,
\* expiry, buyer cancel, the sweep and two fulfil callers. Every safety
\* invariant must hold. (CardTrader buy-through: buy.cfg.)
CONSTANTS
    o1 = o1  o2 = o2
    fw = fw  fs = fs
    Kind <- AllNative
    Stock = 2
    Pays = {o1, o2}
    MaxCrashes = 1
    MaxBuyDoubt = 0
    MaxLeaseExpiry = 1
    MaxRedeliver = 1
    Fixed = TRUE

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ReserveOnce
    FulfilledHoldsStock
    NotReleasedAndFulfilled
    DiscountOnce
    BuyOnce
    OwnershipOnce
