\* Fixed code, CardTrader live lines: two orders buying through the shared
\* Pokoin CardTrader cart, a crash, a lost purchase answer and a lease that
\* expires under a live worker. Every safety invariant must hold.
CONSTANTS
    o1 = o1  o2 = o2
    fw = fw  fs = fs
    Kind <- AllCt
    Stock = 2
    Pays = {o1, o2}
    MaxCrashes = 1
    MaxBuyDoubt = 1
    MaxLeaseExpiry = 1
    MaxRedeliver = 0
    Fixed = TRUE

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    ReserveOnce
    FulfilledHoldsStock
    NotReleasedAndFulfilled
    DiscountOnce
    BuyOnce
    OwnershipOnce
