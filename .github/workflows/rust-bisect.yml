# TEMPORARY diagnostic: why the workspace-wide test run kills the runner. Deleted before merge.
name: rust-bisect
on: pull_request
permissions:
  contents: read
jobs:
  ws:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test --workspace --locked --no-run
        working-directory: pokoin-rust
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
          CARGO_PROFILE_TEST_DEBUG: 0
          CARGO_BUILD_JOBS: 3
      - name: run, single-threaded, hard timeout
        working-directory: pokoin-rust
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
          CARGO_PROFILE_TEST_DEBUG: 0
        run: |
          (while sleep 30; do echo "monitor $(date +%T) $(free -m | awk 'NR==2{print "avail_mb="$7}') $(df -h / | awk 'NR==2{print "disk="$4}') procs=$(ps -e --no-headers | wc -l)"; done) &
          timeout --signal=KILL 1500 cargo test --workspace --locked --no-fail-fast -- --test-threads=1 || echo "exit=$?"
