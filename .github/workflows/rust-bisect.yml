# TEMPORARY diagnostic: which group of crates freezes the runner. Deleted before merge.
name: rust-bisect
on: pull_request
permissions:
  contents: read
jobs:
  group:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pkgs: ["-p pokoin-api -p pokoin-api-common -p pokoin-search -p pokoin-listings -p poko-eval -p cardtrader-sold", "-p pokoin-accounts -p pokoin-config -p pokoin-catalog-api -p pokoin-inventory -p poko-bot -p tcgplayer-match", "-p pokoin-db -p pokoin-assistant-api -p pokoin-commerce -p pokoin-marketplace -p cardtrader-bridge -p cardmarket-catalog", "-p pokoin-media -p pokoin-auth -p pokoin-external -p pokoin-observability -p cardtrader-listing-dump -p tcgplayer-sync-box", "-p pokoin-sort -p pokoin-cache -p pokoin-edge -p pokoin-search-api -p ctbook -p pokoin-sync", "-p pokoin-admin-api -p pokoin-catalog -p pokoin-integrations -p pokoin-shared-dictionary -p cardtrader-price-cache"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test ${{ matrix.pkgs }} --locked --no-fail-fast
        working-directory: pokoin-rust
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
          CARGO_PROFILE_TEST_DEBUG: 0
