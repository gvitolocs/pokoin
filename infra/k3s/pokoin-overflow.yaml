# pokoin-overflow on nezopt k3s — exported from the LIVE cluster 2026-10-07 (kubectl diff = empty).
# Security objects (ServiceAccounts, PDBs, NetworkPolicies, cloudflared) live in pokoin-security.yaml.
# Secrets (pokoin-api-env, pokoin-api-nez-tunnel, pokoin-pg-ca) are created by scripts, never committed.
apiVersion: v1
kind: Namespace
metadata:
  name: pokoin-overflow
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: meili
  namespace: pokoin-overflow
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  selector:
    matchLabels:
      app: meili
  serviceName: meili
  template:
    metadata:
      labels:
        app: meili
    spec:
      containers:
      - env:
        - name: MEILI_ENV
          value: production
        - name: MEILI_HTTP_ADDR
          value: 0.0.0.0:7700
        - name: MEILI_DB_PATH
          value: /meili_data/data.ms
        - name: MEILI_MAX_INDEXING_MEMORY
          value: 1Gb
        - name: MEILI_NO_ANALYTICS
          value: 'true'
        - name: MEILI_MASTER_KEY
          valueFrom:
            secretKeyRef:
              key: MEILI_API_KEY
              name: pokoin-api-env
        image: getmeili/meilisearch:v1.53.1
        name: meili
        ports:
        - containerPort: 7700
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 7700
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: '2'
            memory: 3Gi
          requests:
            cpu: 250m
            memory: 512Mi
        volumeMounts:
        - mountPath: /meili_data
          name: data
      securityContext: {}
      volumes:
      - hostPath:
          path: /srv/pokoin-overflow/meili
          type: DirectoryOrCreate
        name: data
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
---
apiVersion: v1
kind: Service
metadata:
  name: meili
  namespace: pokoin-overflow
spec:
  ports:
  - name: http
    port: 7700
    protocol: TCP
    targetPort: 7700
  selector:
    app: meili
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: pokoin-overflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - args:
        - --save
        - ''
        - --appendonly
        - 'no'
        - --maxmemory
        - 512mb
        - --maxmemory-policy
        - volatile-lru
        image: redis:8.10.2
        name: redis
        ports:
        - containerPort: 6379
          name: redis
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          periodSeconds: 5
          successThreshold: 1
          tcpSocket:
            port: 6379
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            memory: 640Mi
          requests:
            cpu: 50m
            memory: 64Mi
      securityContext: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: pokoin-overflow
spec:
  ports:
  - name: redis
    port: 6379
    protocol: TCP
    targetPort: 6379
  selector:
    app: redis
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pokoin-api
  namespace: pokoin-overflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pokoin-api
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: pokoin-api
    spec:
      automountServiceAccountToken: false
      containers:
      # The Pi's exact Rust release (same commit, x86_64 build) serving the full
      # api.pokoin.com edge on :8080; the API router listens on pod loopback.
      - command:
        - /app/pokoin-api
        env:
        - name: POKOIN_EDGE_BIND
          value: 0.0.0.0:8080
        - name: POKOIN_RUST_BIND
          value: 127.0.0.1:18082
        - name: POKOIN_TRUSTED_PROXY_CIDRS
          value: 10.42.0.0/16
        # The outbox worker runs on the Pi only.
        - name: POKOIN_LISTING_SYNC_WORKER
          value: '0'
        - name: POKOIN_RUST_RELEASE
          value: nez-k3s
        # cdn.pokoin.com second origin (Cloudflare LB with the Pi): the
        # nezopt leftover mirror, read-only. No fallback origin: the mirror is
        # complete, and cdn.pokoin.com would route back here.
        - name: POKOIN_CDN_ROOT
          value: /srv/pokoin/card-images/objects
        - name: POKOIN_CDN_NAME
          value: nez-k3s
        - name: POKOIN_CDN_BIND
          value: 0.0.0.0:8081
        - name: POKOIN_CDN_FALLBACK_ORIGIN
          value: ''
        - name: MARKETPLACE_DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: MARKETPLACE_OVERFLOW_DATABASE_URL
              name: pokoin-api-env
        - name: MARKETPLACE_NAME_SEARCH_DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: MARKETPLACE_OVERFLOW_DATABASE_URL
              name: pokoin-api-env
        - name: MARKETPLACE_DATABASE_SSL
          value: '1'
        - name: MARKETPLACE_DATABASE_SSL_VERIFY
          value: '1'
        - name: MARKETPLACE_WRITER_DATABASE_SSL
          value: '1'
        - name: MARKETPLACE_WRITER_DATABASE_SSL_VERIFY
          value: '1'
        - name: POKOIN_RUST_DB_POOL_MAX
          value: '8'
        # Domain pools per game database; every game database shares one writer.
        - name: POKOIN_RUST_DOMAIN_DB_POOL_MAX
          value: '4'
        - name: MEILI_HOST
          value: http://meili.pokoin-overflow.svc.cluster.local:7700
        - name: REDIS_HOST
          value: redis.pokoin-overflow.svc.cluster.local
        - name: REDIS_PORT
          value: '6379'
        - name: POKOIN_CDN_HEALTH_URL
          value: https://cdn.pokoin.com/health
        - name: PIPELINE_HEALTH_TIMEOUT_MS
          value: '2000'
        - name: SCAN_PRIMARY_URL
          value: http://172.31.250.12:18151
        - name: SCAN_FALLBACK_URL
          value: http://172.31.250.12:18151
        - name: RUST_LOG
          value: info
        envFrom:
        - secretRef:
            name: pokoin-api-env
        image: gcr.io/distroless/cc-debian12:nonroot@sha256:9dac0a79194e45a7da0158a9c6da57b217585af0786db3845d1f0ec1a0dd182f
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /livez
            port: 8080
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 2
        name: api
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 8081
          name: cdn
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: 8080
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            cpu: '2'
            memory: 768Mi
          requests:
            cpu: 500m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - mountPath: /etc/pokoin/pg-ca
          name: pg-ca
          readOnly: true
        - mountPath: /app
          name: app
          readOnly: true
        - mountPath: /srv/pokoin/seo
          name: seo
          readOnly: true
        - mountPath: /srv/pokoin/card-images/objects
          name: cdn
          readOnly: true
        - mountPath: /tmp
          name: tmp
        workingDir: /app
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: pokoin-api
      serviceAccountName: pokoin-api
      volumes:
      - name: pg-ca
        secret:
          defaultMode: 292
          secretName: pokoin-pg-ca
      - emptyDir:
          sizeLimit: 64Mi
        name: tmp
      - hostPath:
          path: /srv/pokoin-overflow/rust/current
          type: Directory
        name: app
      - hostPath:
          path: /srv/pokoin-overflow/seo
          type: DirectoryOrCreate
        name: seo
      # nezopt-k3s.sh up binds ~/data/pokoin-leftovers/objects here (ro).
      - hostPath:
          path: /srv/pokoin-cdn
          type: Directory
        name: cdn
---
apiVersion: v1
kind: Service
metadata:
  name: pokoin-api
  namespace: pokoin-overflow
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080
  - name: cdn
    port: 8081
    protocol: TCP
    targetPort: 8081
  selector:
    app: pokoin-api
  type: ClusterIP
---
# The pokoin-cdn tunnel's origin name: on the Pi it resolves to 127.0.0.1
# (/etc/hosts), here to the API pods' CDN listener.
apiVersion: v1
kind: Service
metadata:
  name: pokoin-cdn-origin
  namespace: pokoin-overflow
spec:
  ports:
  - name: cdn
    port: 18081
    protocol: TCP
    targetPort: 8081
  selector:
    app: pokoin-api
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pokoin-api
  namespace: pokoin-overflow
spec:
  behavior:
    scaleDown:
      policies:
      - periodSeconds: 15
        type: Percent
        value: 100
      selectPolicy: Max
      stabilizationWindowSeconds: 300
    scaleUp:
      policies:
      - periodSeconds: 15
        type: Pods
        value: 2
      selectPolicy: Max
      stabilizationWindowSeconds: 0
  maxReplicas: 4
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 60
        type: Utilization
    type: Resource
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pokoin-api
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: search-delta
  namespace: pokoin-overflow
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 170
      backoffLimit: 0
      template:
        spec:
          automountServiceAccountToken: false
          containers:
          - command:
            - /app/pokoin-api
            - job
            - search-delta
            env:
            - name: MARKETPLACE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: MARKETPLACE_OVERFLOW_DATABASE_URL
                  name: pokoin-api-env
            - name: REDIS_HOST
              value: redis.pokoin-overflow.svc.cluster.local
            - name: REDIS_PORT
              value: '6379'
            - name: RUST_LOG
              value: info
            envFrom:
            - secretRef:
                name: pokoin-api-env
            image: gcr.io/distroless/cc-debian12:nonroot@sha256:9dac0a79194e45a7da0158a9c6da57b217585af0786db3845d1f0ec1a0dd182f
            name: search-delta
            resources:
              limits:
                cpu: '1'
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsGroup: 1000
              runAsNonRoot: true
              runAsUser: 1000
            volumeMounts:
            - mountPath: /etc/pokoin/pg-ca
              name: pg-ca
              readOnly: true
            - mountPath: /app
              name: app
              readOnly: true
            workingDir: /app
          restartPolicy: Never
          securityContext:
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - name: pg-ca
            secret:
              defaultMode: 292
              secretName: pokoin-pg-ca
          - hostPath:
              path: /srv/pokoin-overflow/rust/current
              type: Directory
            name: app
  schedule: '*/2 * * * *'
  successfulJobsHistoryLimit: 1
  suspend: false
# Drift guard: rebuild the Redis Search index from Postgres every night.
