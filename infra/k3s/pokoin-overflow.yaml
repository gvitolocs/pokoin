# Pokoin Pi overflow on nezopt (k3s in Docker, see scripts/nezopt-k3s.sh).
#
# The Pi keeps serving api.pokoin.com. When its API has too many requests in
# flight, pokoin-api-edge sends GET/HEAD requests here (NodePort 30880 on
# nezopt's LAN address). This namespace runs the same API release as the Pi
# with its own Meilisearch copy, reading the writer Postgres on
# nezopt. The HPA keeps one API pod warm and adds pods under CPU load.
#
# Secret pokoin-api-env is created by scripts/nezopt-k3s.sh from the Pi
# container's environment — never committed. It adds
# MARKETPLACE_OVERFLOW_DATABASE_URL: the writer URL with its host swapped for
# the writer container's address on the pokoin-overflow Docker network.
apiVersion: v1
kind: Namespace
metadata:
  name: pokoin-overflow
---
# Meilisearch copy of marketplace_cards / marketplace_name_tokens.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: meili
  namespace: pokoin-overflow
spec:
  serviceName: meili
  replicas: 1
  selector:
    matchLabels: { app: meili }
  template:
    metadata:
      labels: { app: meili }
    spec:
      containers:
        - name: meili
          # Production pin (D00000A): same version as the Pi.
          image: getmeili/meilisearch:v1.53.1
          env:
            - { name: MEILI_ENV, value: production }
            - { name: MEILI_HTTP_ADDR, value: "0.0.0.0:7700" }
            - { name: MEILI_DB_PATH, value: /meili_data/data.ms }
            - { name: MEILI_MAX_INDEXING_MEMORY, value: 1Gb }
            - { name: MEILI_NO_ANALYTICS, value: "true" }
            - name: MEILI_MASTER_KEY
              valueFrom: { secretKeyRef: { name: pokoin-api-env, key: MEILI_API_KEY } }
          ports:
            - { containerPort: 7700, name: http }
          readinessProbe:
            httpGet: { path: /health, port: 7700 }
            periodSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 3Gi }
          volumeMounts:
            - { name: data, mountPath: /meili_data }
      volumes:
        - name: data
          hostPath: { path: /srv/pokoin-overflow/meili, type: DirectoryOrCreate }
---
apiVersion: v1
kind: Service
metadata:
  name: meili
  namespace: pokoin-overflow
spec:
  selector: { app: meili }
  ports:
    - { port: 7700, targetPort: 7700, name: http }
---
# Shared cache/search Redis lives only on the Pi (:6380). Overflow pods do not
# run a second Redis — cache helpers fail open to Postgres/Firestore.
# The Pi API release (synced to /srv/pokoin-overflow/api/current).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pokoin-api
  namespace: pokoin-overflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: pokoin-api }
  template:
    metadata:
      labels: { app: pokoin-api }
    spec:
      containers:
        - name: api
          image: node:20-bookworm
          workingDir: /app
          command: ["node", "server/oracle-api-server.js"]
          envFrom:
            - secretRef: { name: pokoin-api-env }
          env:
            - { name: PORT, value: "8080" }
            - { name: NODE_ENV, value: production }
            # Reads go to the writer Postgres on nezopt (not the Pi replica),
            # over the pokoin-overflow Docker network — see scripts/nezopt-k3s.sh.
            - name: MARKETPLACE_DATABASE_URL
              valueFrom: { secretKeyRef: { name: pokoin-api-env, key: MARKETPLACE_OVERFLOW_DATABASE_URL } }
            - name: MARKETPLACE_NAME_SEARCH_DATABASE_URL
              valueFrom: { secretKeyRef: { name: pokoin-api-env, key: MARKETPLACE_OVERFLOW_DATABASE_URL } }
            # _marketplace_db.js turns SSL off only for the exact string "0".
            - { name: MARKETPLACE_DATABASE_SSL, value: "0" }
            - { name: MARKETPLACE_DATABASE_POOL_MAX, value: "8" }
            - { name: MEILI_HOST, value: "http://meili.pokoin-overflow.svc.cluster.local:7700" }
            # Intentionally unreachable inside the pod: fail-open cache path.
            - { name: REDIS_HOST, value: "127.0.0.1" }
            - { name: REDIS_PORT, value: "6380" }
            - { name: POKOIN_OVERFLOW_NODE, value: nezopt }
            # The CDN runs on the Pi, not this pod's loopback interface.
            - { name: POKOIN_CDN_HEALTH_URL, value: "https://cdn.pokoin.com/health" }
            - { name: PIPELINE_HEALTH_TIMEOUT_MS, value: "2000" }
          ports:
            - { containerPort: 8080, name: http }
          readinessProbe:
            httpGet: { path: "/api/marketplace-suggest?q=pika&limit=1", port: 8080 }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 500m, memory: 384Mi }
            limits: { cpu: "2", memory: 1536Mi }
          volumeMounts:
            - { name: app, mountPath: /app, readOnly: true }
      volumes:
        - name: app
          hostPath: { path: /srv/pokoin-overflow/api/current, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: pokoin-api
  namespace: pokoin-overflow
spec:
  type: NodePort
  selector: { app: pokoin-api }
  ports:
    - { port: 8080, targetPort: 8080, nodePort: 30880, name: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pokoin-api
  namespace: pokoin-overflow
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: pokoin-api }
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - { type: Pods, value: 2, periodSeconds: 15 }
    scaleDown:
      stabilizationWindowSeconds: 300
---
# Keep the Meili copy fresh: same delta script the Pi timer runs every 2 min.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: meili-delta
  namespace: pokoin-overflow
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 170
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: sync
              image: node:20-bookworm
              workingDir: /app
              command: ["node", "scripts/meili-sync-marketplace-delta.js"]
              envFrom:
                - secretRef: { name: pokoin-api-env }
              env:
                - name: MARKETPLACE_DATABASE_URL
                  valueFrom: { secretKeyRef: { name: pokoin-api-env, key: MARKETPLACE_OVERFLOW_DATABASE_URL } }
                - { name: MEILI_HOST, value: "http://meili.pokoin-overflow.svc.cluster.local:7700" }
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: "1", memory: 1Gi }
              volumeMounts:
                - { name: app, mountPath: /app, readOnly: true }
          volumes:
            - name: app
              hostPath: { path: /srv/pokoin-overflow/api/current, type: Directory }
---
# Nightly full rebuild of both indexes (drift guard; delta only covers 10 min).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: meili-full
  namespace: pokoin-overflow
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: sync
              image: node:20-bookworm
              workingDir: /app
              command: ["sh", "-c", "node scripts/meili-sync-marketplace-full.js && node scripts/meili-sync-name-tokens-full.js"]
              envFrom:
                - secretRef: { name: pokoin-api-env }
              env:
                - name: MARKETPLACE_DATABASE_URL
                  valueFrom: { secretKeyRef: { name: pokoin-api-env, key: MARKETPLACE_OVERFLOW_DATABASE_URL } }
                - { name: MEILI_HOST, value: "http://meili.pokoin-overflow.svc.cluster.local:7700" }
              resources:
                requests: { cpu: 250m, memory: 512Mi }
                limits: { cpu: "2", memory: 2Gi }
              volumeMounts:
                - { name: app, mountPath: /app, readOnly: true }
          volumes:
            - name: app
              hostPath: { path: /srv/pokoin-overflow/api/current, type: Directory }
