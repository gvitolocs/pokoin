spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3000
      backoffLimit: 0
      template:
        spec:
          automountServiceAccountToken: false
          containers:
          - command:
            - /app/pokoin-api
            - job
            - build-lists
            - --kind=median
            env:
            - name: POKOIN_RUST_BIND
              value: 127.0.0.1:18082
            - name: POKOIN_TRUSTED_PROXY_CIDRS
              value: 10.42.0.0/16
            - name: POKOIN_LISTING_SYNC_WORKER
              value: '0'
