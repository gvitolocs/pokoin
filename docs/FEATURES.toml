# docs/FEATURES.toml — the feature map: every user-visible flow of Pokoin and the proof that it works.
# Checked by scripts/check-features.sh in repo-gate (.github/workflows/repo-ci.yml); docs/CI.md ("Feature map").
#
# One [[flow]] block per flow, money flows first. Exactly these keys, one per line:
#   id      kebab-case, unique.
#   name    what the user does, a few words.
#   money   true for every flow that moves or prices money (cart, checkout, payment, refund, payout,
#           PKN balance, shipping cost, buy orders, the pricing tools a seller sets prices with).
#   entry   tracked files where the user reaches the flow — the page or the caller, not the handler that answers it;
#           [] when this repository holds no user-facing surface for it: a job, a machine-called connector or
#           webhook, a flow only staff perform, or a client that lives in another repository.
#   proof   tracked test files, with ::<test name> when one test is meant; [] only for an unproved flow.
#   status  "proved"   — a test the CI runs drives the flow through the real handler and asserts its main result
#                        (real router or direct handler call; mock Firestore or real Postgres behind it);
#           "partial"  — tests cover parts of the flow (units, client side, a guard path) but no test drives its
#                        main result through the real handler;
#           "unproved" — no proof exists (proof = []); the flow is absent, or only production code without a test.
#
# The map only grows: a flow that is gone gets status and a reason, not a deletion
# (scripts/check-features.sh --base refuses removed flows and more unproved money flows than at the base).
# Comments are whole lines only; string values are in double quotes; arrays stay on one line.

