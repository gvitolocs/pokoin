# The nezopt writer's settings (scripts/install-pokoin-postgres-nvme.sh),
# with memory halved so two servers fit one 16 GB host side by side.
listen_addresses = '127.0.0.1'
wal_level = replica
max_wal_senders = 8
max_replication_slots = 8
hot_standby = on
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 64MB
maintenance_work_mem = 1GB
max_wal_size = 4GB
checkpoint_timeout = 15min
max_connections = 120
