# Pi: cap Docker json-file logs (installed by scripts/deploy-pi-logrotate.sh).
# Containers were created without log-opts, so logs grew without limit
# (Postgres replica 454 MB, Meili 166 MB on 2026-09-29) and heavy traffic
# would fill the SD card. Docker opens these files O_APPEND, so copytruncate
# is safe and no container or daemon restart is needed.
/srv/pokoin/docker/containers/*/*-json.log {
  maxsize 50M
  rotate 3
  compress
  delaycompress
  missingok
  notifempty
  copytruncate
}
