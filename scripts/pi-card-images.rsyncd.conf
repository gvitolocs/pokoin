# Read-only LAN export of Pi card-images. Not SSH.
#
# On pi-home:
#   install -m 644 pi-card-images.rsyncd.conf /etc/rsyncd.conf
#   systemctl enable --now rsync
#   # or: rsync --daemon --config /etc/rsyncd.conf
#
# From nezopt:
#   rsync -aH --delete --exclude /artcut/ \
#     rsync://192.168.178.46/card-images/ \
#     /home/nez/mnt/mybook/pokoin-pi-card-images/
#
# Bind LAN only. Do not publish 873 on the internet.

uid = nez
gid = nez
use chroot = yes
max connections = 4
pid file = /run/rsyncd.pid
address = 192.168.178.46

[card-images]
path = /srv/pokoin/card-images
comment = Pokoin leftover origin (read-only)
read only = yes
list = yes
exclude = artcut/ lost+found/
timeout = 300
