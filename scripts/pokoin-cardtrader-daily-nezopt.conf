[Service]
# CardTrader GET stays on Oracle. Persist/SQL goes to nezopt 15T Postgres
# through reverse tunnel 127.0.0.1:15543 → nezopt 127.0.0.1:25432.
# Env file is host-local (.env.cardtrader-nezopt); do not commit it.
Environment=CARDTRADER_DUMP_ENV_FILE=/home/ubuntu/pokoin-oracle-api/.env.cardtrader-nezopt
Environment=CARDTRADER_ORACLE_API_ROOT=/home/ubuntu/cardtrader-oracle-api
Environment=MARKETPLACE_DATABASE_SSL=0
Environment=CARDTRADER_MARKET_PERSIST_CONCURRENCY=4
Environment=MARKETPLACE_DATABASE_POOL_MAX=12
Environment=CARDTRADER_MARKET_EXTRA_ARGS=
Environment=NODE_OPTIONS=--max-old-space-size=768
