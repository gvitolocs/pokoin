<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 110 960 290" role="img" aria-labelledby="t d">
  <title id="t">Pokoin Flex</title>
  <desc id="d">Many small padded packs ride into one 20 kg Pokoin bag, travel to the sorting center, and wait at a partner shop.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="55%">
      <stop offset="0" stop-color="#ffd33d" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffd33d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f4a92"/>
      <stop offset="1" stop-color="#1a2a57"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#f5b814"/>
    </linearGradient>
    <g id="pack">
      <rect x="-22" y="-16" width="44" height="32" rx="6" fill="url(#box)"/>
      <rect x="-22" y="-16" width="44" height="9" rx="4" fill="#fff" fill-opacity=".35"/>
      <circle cx="0" cy="4" r="6" fill="#23376e"/>
      <circle cx="0" cy="4" r="3" fill="#ffd33d"/>
    </g>
    <g id="coin">
      <circle r="16" fill="#ffd33d" stroke="#23376e" stroke-width="4"/>
      <path d="M-5 -5h4v10h-4zM3 -5h3v10h-3z" fill="#23376e"/>
    </g>
  </defs>

  
  <ellipse cx="470" cy="240" rx="420" ry="190" fill="url(#glow)"/>

  <!-- route -->
  <path d="M120 250 C 220 250, 250 250, 330 250 M 560 250 C 620 250, 650 250, 700 250 M 790 250 C 820 250, 840 250, 860 250"
        fill="none" stroke="#ffd33d" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round" opacity=".8"/>

  <!-- packs flowing in -->
  <g opacity=".55"><use href="#pack" transform="translate(60 150) rotate(-10) scale(.8)"/></g>
  <g opacity=".7"><use href="#pack" transform="translate(110 200) rotate(8) scale(.85)"/></g>
  <use href="#pack" transform="translate(70 262) rotate(-4)"/>
  <g opacity=".75"><use href="#pack" transform="translate(150 318) rotate(12) scale(.9)"/></g>
  <use href="#pack" transform="translate(205 236) rotate(-8) scale(.95)"/>
  <use href="#pack" transform="translate(262 278) rotate(6) scale(.9)"/>
  <g opacity=".6"><use href="#pack" transform="translate(240 180) rotate(14) scale(.75)"/></g>

  <!-- 20 kg bag -->
  <g transform="translate(445 245)">
    <ellipse cx="0" cy="118" rx="110" ry="14" fill="#000" opacity=".35"/>
    <path d="M-92 -58 C -118 10, -112 96, -70 112 L 70 112 C 112 96, 118 10, 92 -58 Z" fill="url(#bag)" stroke="#0f1a38" stroke-width="3"/>
    <path d="M-92 -58 C -60 -84, 60 -84, 92 -58 C 60 -46, -60 -46, -92 -58 Z" fill="#3a58a8"/>
    <path d="M-30 -74 C -24 -110, 24 -110, 30 -74" fill="none" stroke="#ffd33d" stroke-width="8" stroke-linecap="round"/>
    <path d="M-78 -20 C -40 -8, 40 -8, 78 -20" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="6"/>
    <use href="#pack" transform="translate(-40 -62) rotate(-12) scale(.7)"/>
    <use href="#pack" transform="translate(6 -70) rotate(6) scale(.72)"/>
    <use href="#pack" transform="translate(46 -60) rotate(16) scale(.66)"/>
    <use href="#coin" transform="translate(0 30) scale(1.6)"/>
    <g transform="translate(58 -34) rotate(10)">
      <line x1="-14" y1="-10" x2="0" y2="0" stroke="#ffd33d" stroke-width="3"/>
      <rect x="0" y="-4" width="64" height="30" rx="7" fill="#ffd33d"/>
      <text x="32" y="17" text-anchor="middle" font-family="Satoshi, system-ui, sans-serif" font-size="16" font-weight="800" fill="#111">20 KG</text>
    </g>
  </g>

  <!-- sorting center -->
  <g transform="translate(745 250)">
    <ellipse cx="0" cy="62" rx="58" ry="9" fill="#000" opacity=".35"/>
    <path d="M-52 60 V -6 L 0 -40 L 52 -6 V 60 Z" fill="#1f2130" stroke="#ffd33d" stroke-width="3" stroke-linejoin="round"/>
    <rect x="-20" y="18" width="40" height="42" rx="3" fill="#ffd33d"/>
    <path d="M-20 30 h40 M-20 42 h40" stroke="#1f2130" stroke-width="3"/>
    <use href="#coin" transform="translate(0 -8) scale(.7)"/>
  </g>

  <!-- partner shop with pickup -->
  <g transform="translate(890 252)">
    <ellipse cx="0" cy="60" rx="46" ry="8" fill="#000" opacity=".35"/>
    <rect x="-40" y="-6" width="80" height="66" rx="4" fill="#1f2130" stroke="#fff" stroke-opacity=".7" stroke-width="3"/>
    <path d="M-46 -6 h92 l-8 -22 h-76 Z" fill="#ffd33d"/>
    <path d="M-38 -6 v8 M-22 -6 v8 M-6 -6 v8 M10 -6 v8 M26 -6 v8" stroke="#23376e" stroke-width="5" stroke-linecap="round"/>
    <rect x="-12" y="24" width="24" height="36" rx="2" fill="#23376e"/>
    <use href="#pack" transform="translate(24 44) scale(.5)"/>
  </g>
</svg>
