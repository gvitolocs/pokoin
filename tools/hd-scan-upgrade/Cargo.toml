[package]
name = "hd-scan-upgrade"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
description = "Match Pokemon leftover CDN scans to larger scans of the same printing (tcgdex, artofpkm), verify them visually, and encode the upgrades"

# Own workspace: image tooling must not change the production API lockfile.
[workspace]

[[bin]]
name = "hd-scan-upgrade"
path = "src/main.rs"

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
jpeg-encoder = "0.6"
rayon = "1"
serde_json = "1"
webp = "0.3"

[profile.release]
strip = true
