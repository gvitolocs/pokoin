[package]
name = "pokoin-ops"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
description = "Pokoin host operations: failure mail, sentinel, Postgres backups and restore tests"

# Own workspace: ops tooling must not change the production API lockfile.
[workspace]

[[bin]]
name = "pokoin-ops"
path = "src/main.rs"

[dependencies]
age = "0.11"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
